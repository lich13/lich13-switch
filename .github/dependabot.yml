version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      react:
        applies-to: version-updates
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      frontend-runtime:
        applies-to: version-updates
        dependency-type: production
        exclude-patterns: ['react', 'react-dom']
      frontend-tooling:
        applies-to: version-updates
        dependency-type: development
        exclude-patterns: ['@types/react', '@types/react-dom']
      frontend-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
        # Filter breaking candidates before Cargo resolution, including 0.x minor bumps.
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      rust-compatible:
        applies-to: version-updates
        patterns: ['*']
      rust-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
