name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: node
          check-latest: true
          cache: pnpm
      - name: Install repository Rust toolchain
        run: rustup update stable
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit
      - name: Install Rust audit tool
        if: always()
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        if: always()
        # Vulnerabilities fail the job. RUSTSEC-2024-0429 is in Linux-only glib 0.18
        # (never compiled on macOS or Windows targets).
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: node
          check-latest: true
          cache: pnpm
      - name: Install repository Rust toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/check-network-hosts.py
      - run: python3 scripts/check-error-codes.py
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          RUST_BACKTRACE: "1"
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
