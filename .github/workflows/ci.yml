name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install repository Rust toolchain
        run: cargo --version
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit
      - name: Install pinned Rust audit tool
        if: always()
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        if: always()
        # Vulnerabilities fail the job. Informational/unmaintained advisories are
        # reported separately by cargo-audit, without a blanket ignore list.
        run: cargo audit --file src-tauri/Cargo.lock
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install repository Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/check-network-hosts.py
      - run: python3 scripts/check-error-codes.py
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Report Windows legacy file owner coverage
        if: runner.os == 'Windows'
        # This fixture can be unavailable for tokens without owner-change rights.
        # Show its explicit skip reason instead of counting it as executed coverage.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml protecting_group_owned_file_restores_current_user_as_owner -- --nocapture
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
