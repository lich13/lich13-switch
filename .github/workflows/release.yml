name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install repository Rust toolchain and target
        run: |
          cargo --version
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          RUST_BACKTRACE: "1"
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Installed Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'lich13-switch-installed'
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $old = Join-Path $env:RUNNER_TEMP 'legacy-installer'
          New-Item -ItemType Directory -Path $old | Out-Null
          gh release download v0.7.2 --repo "$env:GITHUB_REPOSITORY" --pattern '*x64-setup.exe' --dir $old
          if ($LASTEXITCODE -ne 0) { throw 'Legacy installer download failed' }
          $legacy = Get-ChildItem $old -Filter '*.exe' | Select-Object -First 1
          $legacyInstall = Start-Process $legacy.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0 -or !(Test-Path "$installDir/gpt-switch.exe")) { throw 'Legacy install failed' }
          $data = Join-Path $env:APPDATA 'com.lich13.gpt-switch'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $marker = Join-Path $data 'upgrade-fixture.txt'
          Set-Content $marker 'preserve-user-data'
          $protocol = 'HKCU:\Software\Classes\ccswitch\shell\open\command'
          New-Item $protocol -Force | Out-Null
          Set-Item $protocol '"C:\fixture\lich13studio.exe" "%1"'
          $beforeProtocol = (Get-Item $protocol).GetValue('')
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Get-ChildItem $installDir -Filter 'lich13-switch.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Installed executable missing' }
          if (Test-Path "$installDir/gpt-switch.exe") { throw 'Legacy binary remains' }
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = Get-ItemProperty "$uninstall/gpt-Switch"
          if ($entry.DisplayName -ne 'lich13-switch' -or $entry.DisplayVersion -ne $expectedVersion -or (Test-Path "$uninstall/lich13-switch")) { throw 'Duplicate or invalid upgrade registration' }
          if ((Get-Content $marker).Trim() -ne 'preserve-user-data' -or (Get-Item $protocol).GetValue('') -ne $beforeProtocol) { throw 'Upgrade changed user data or default protocol' }
          $notice = Get-Content (Join-Path $installDir 'THIRD_PARTY_NOTICES.md') -Raw
          if (!$notice.Contains('Copyright (c) 2025 Jason Young')) { throw 'Third-party notice missing' }
          $report = Join-Path $env:RUNNER_TEMP 'lich13-switch-smoke.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--smoke-test', $report) -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke timed out' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if (!$result.ok -or !$result.webview -or !$result.tray -or !$result.gateway -or !$result.safeExit -or $result.revision -ne $env:GITHUB_SHA) { throw 'Smoke failed' }
          $remove = Start-Process "$installDir/uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path "$uninstall/gpt-Switch") -or (Test-Path $exe.FullName)) { throw 'Uninstall failed' }
          if ((Get-Item $protocol).GetValue('') -ne $beforeProtocol -or !(Test-Path $marker)) { throw 'Uninstall damaged other app or data' }
      - name: Installed macOS DMG smoke test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          report="$RUNNER_TEMP/lich13-switch-smoke.json"
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/lich13-switch-volume"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          ditto "$mount/lich13-switch.app" "$RUNNER_TEMP/lich13-switch.app"
          hdiutil detach "$mount"
          executable="$RUNNER_TEMP/lich13-switch.app/Contents/MacOS/lich13-switch"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = "arm64"
          python3 -c 'import pathlib,sys; assert "Copyright (c) 2025 Jason Young" in pathlib.Path(sys.argv[1]).read_text()' "$RUNNER_TEMP/lich13-switch.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          "$executable" --smoke-test "$report" &
          pid=$!
          for attempt in {1..60}; do
            if [ -f "$report" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -f "$report" ]; then kill "$pid" 2>/dev/null || true; exit 1; fi
          wait "$pid"
          python3 -c 'import json,sys,os; d=json.load(open(sys.argv[1])); print(d); assert d["ok"] and d["webview"] and d["tray"] and d["gateway"] and d["safeExit"] and d["revision"] == os.environ["GITHUB_SHA"]' "$report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect installers and checksums
        run: |
          mkdir release-assets
          python3 scripts/collect-release.py artifacts release-assets "${GITHUB_REF_NAME#v}"
          cd release-assets
          sha256sum *.dmg *.exe > SHA256SUMS
      - name: Prepare Chinese release notes
        run: python3 scripts/extract-release-notes.py RELEASE.md "${GITHUB_REF_NAME#v}" release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "lich13-switch $GITHUB_REF_NAME" --notes-file release-notes.md
