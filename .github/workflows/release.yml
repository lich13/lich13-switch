name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fail in seconds when RELEASE.md has no section for this tag.
      - run: python3 scripts/extract-release-notes.py RELEASE.md "${GITHUB_REF_NAME#v}" /dev/null
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install repository Rust and Node toolchains
        run: |
          rustup toolchain install
          pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit
      - name: Install Rust audit tool
        if: always()
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        if: always()
        # Vulnerabilities fail the job. RUSTSEC-2024-0429 is in Linux-only glib 0.18
        # (never compiled on macOS or Windows targets).
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
  build:
    needs: notes
    if: always() && needs.notes.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install repository Rust and Node toolchains
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      # Logic tests run on macOS only. Windows keeps the platform modules, so a
      # wall-clock flake in shared logic cannot block a release.
      - name: Frontend tests
        if: runner.os == 'macOS'
        run: pnpm test
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        if: runner.os == 'macOS'
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust tests (platform modules)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml --
          storage:: links:: startup:: cleanup_spool:: process_control:: notifications:: power::
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Installed Windows launch check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'vela-installed'
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $data = Join-Path $HOME '.vela'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $marker = Join-Path $data 'upgrade-fixture.txt'
          Set-Content $marker 'preserve-user-data'
          $protocol = 'HKCU:\Software\Classes\ccswitch\shell\open\command'
          New-Item $protocol -Force | Out-Null
          Set-Item $protocol '"C:\fixture\other-app.exe" "%1"'
          $beforeProtocol = (Get-Item $protocol).GetValue('')
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $legacy = 'HKCU:\Software\Classes\gptSwitch.CCSwitch.0'
          New-Item $legacy -Force | Out-Null
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Get-ChildItem $installDir -Filter 'vela.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Installed executable missing' }
          $entry = Get-ItemProperty "$uninstall/Vela"
          if ($entry.DisplayName -ne 'Vela' -or $entry.DisplayVersion -ne $expectedVersion) { throw 'Invalid install registration' }
          if ((Get-Content $marker).Trim() -ne 'preserve-user-data') { throw 'Install changed user data' }
          if (Test-Path $legacy) { throw 'Legacy link identifiers survived the upgrade' }
          $selfCommand = 'HKCU:\Software\Classes\Vela.CCSwitch\shell\open\command'
          if ((Get-Item $selfCommand).GetValue('') -ne ('"' + $exe.FullName + '" "%1"')) { throw 'Self link registration is missing' }
          if ((Get-Item $protocol).GetValue('') -ne $beforeProtocol) { throw 'Install changed the default protocol' }
          $notice = Get-Content (Join-Path $installDir 'THIRD_PARTY_NOTICES.md') -Raw
          if (!$notice.Contains('Copyright (c) 2025 Jason Young')) { throw 'Third-party notice missing' }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--vela-login-startup') -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw 'Installed application exited during launch' }
          Stop-Process -Id $process.Id -Force
          $remove = Start-Process "$installDir/uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path "$uninstall/Vela") -or (Test-Path $exe.FullName)) { throw 'Uninstall failed' }
          if ((Test-Path $selfCommand) -or !(Test-Path $marker)) { throw 'Uninstall left link registration or removed data' }
      - name: Installed macOS launch check
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/vela-volume"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          ditto "$mount/Vela.app" "$RUNNER_TEMP/Vela.app"
          hdiutil detach "$mount"
          executable="$RUNNER_TEMP/Vela.app/Contents/MacOS/vela"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = "arm64"
          python3 -c 'import pathlib,sys; assert "Copyright (c) 2025 Jason Young" in pathlib.Path(sys.argv[1]).read_text()' "$RUNNER_TEMP/Vela.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          "$executable" --vela-login-startup &
          pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then echo 'installed application exited during launch'; exit 1; fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect installers and checksums
        run: |
          mkdir release-assets
          python3 scripts/collect-release.py artifacts release-assets "${GITHUB_REF_NAME#v}"
          cd release-assets
          sha256sum *.dmg *.exe > SHA256SUMS
      - name: Prepare Chinese release notes
        run: python3 scripts/extract-release-notes.py RELEASE.md "${GITHUB_REF_NAME#v}" release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "Vela $GITHUB_REF_NAME" --notes-file release-notes.md
