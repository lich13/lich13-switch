[package]
name = "lich13-switch"
version = "0.18.0"
description = "Independent Codex and Claude Code providers and local gateways"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "lich13_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "net", "fs", "rt-multi-thread", "test-util"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "zstd"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tower-service = "0.3"
url = "2"
toml_edit = "0.23"
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
mime = "0.3"
multer = "3"
flate2 = "1"
zstd = "0.13"
yawc = { version = "0.4.2", default-features = false, features = ["zlib", "rustls-ring"] }
auto-launch = "0.5"
sysinfo = "0.33"
plist = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rust_decimal = { version = "1", features = ["serde-str"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSBundle", "NSURL", "NSError", "NSString"] }
block2 = "0.6"

[dev-dependencies]
tokio-tungstenite = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
winreg = "0.55"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

[profile.release.build-override]
strip = "none"
