[package]
name = "lich13-switch"
version = "0.26.12"
description = "Independent Codex, Claude Code and Grok Build providers and local gateways"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "lich13_switch_lib"
crate-type = ["rlib"]

[build-dependencies]
# Keep generated context code compatible with the Tauri 2.11 Windows API.
tauri-build = { version = "~2.6.3", features = [] }
tauri-codegen = "~2.6.3"

[dependencies]
lmfpd = { path = "vendor/lmfpd" }
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
# Keep the runtime and menu macro interfaces compatible with Tauri 2.11.
tauri-macros = "~2.6.3"
tauri-runtime = "~2.11.3"
tauri-runtime-wry = { version = "~2.11.4", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
regex = "1"
sha1 = "0.10"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "net", "fs", "rt-multi-thread", "test-util"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tower-service = "0.3"
url = "2"
toml_edit = "0.23"
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
mime = "0.3"
multer = "3"
flate2 = "1"
brotli = "8"
zstd = "0.14.3"
yawc = { version = "0.4.2", default-features = false, features = ["zlib", "rustls-ring"] }
auto-launch = "0.5"
sysinfo = "0.33"
plist = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rust_decimal = { version = "1", features = ["serde-str"] }
# 0.3.5 breaks the existing DSH empty-array/comment round-trip fixtures.
yaml-edit = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSWorkspace", "NSRunningApplication", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSBundle", "NSURL", "NSError", "NSString"] }
block2 = "0.6"

[dev-dependencies]
tokio-tungstenite = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Console"] }
winreg = "0.55"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

[profile.release.build-override]
strip = "none"

[patch.crates-io]
glib = { path = "vendor/glib" }
